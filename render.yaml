services:
  - type: web
    name: vme-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VME_DB_PATH
        value: ./backend/data/vme.sqlite
      - key: AUTH_SECRET
        generateValue: true
    # Note: Render persistent disks require a paid Starter plan ($7/mo + $0.25/GB).
    # To enable persistent disk, change plan to 'starter' and uncomment the disk section below:
    # disk:
    #   name: vme-sqlite-disk
    #   mountPath: /var/data
    #   sizeGB: 1
